<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperDM Integration</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 310px;
        margin: 0;
        padding: 14px;
        background: #020617;
        color: #f1f5f9;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid #1e293b;
        margin-bottom: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 14px;
      }
      .brand img {
        width: 24px;
        height: 24px;
        border-radius: 6px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.online {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
      }
      .badge.offline {
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .label {
        font-size: 12px;
        color: #cbd5e1;
        font-weight: 500;
      }
      .sub {
        font-size: 11px;
        color: #64748b;
        margin-top: 2px;
      }
      input[type="number"],
      input[type="url"] {
        background: #020617;
        border: 1px solid #334155;
        color: #f8fafc;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        outline: none;
      }
      input[type="number"] {
        width: 82px;
        text-align: right;
      }
      input[type="url"] {
        width: 100%;
        margin-top: 6px;
      }
      input:focus {
        border-color: #0ea5e9;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 7px 10px;
        border: none;
        border-radius: 7px;
        background: #0ea5e9;
        color: #020617;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #38bdf8;
      }
      .msg {
        margin-top: 6px;
        font-size: 11px;
        min-height: 14px;
      }
      .msg.ok {
        color: #34d399;
      }
      .msg.err {
        color: #fb7185;
      }
      .divider {
        height: 1px;
        background: #1e293b;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="icons/icon128.png" alt="HyperDM" />
        <span>HyperDM</span>
      </div>
      <span id="statusBadge" class="badge offline">
        <span class="dot"></span>
        <span id="statusText">Checking...</span>
      </span>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="label">Intercept Downloads</div>
          <div class="sub">Auto-send browser downloads to HyperDM</div>
        </div>
        <input type="checkbox" id="enabledToggle" />
      </div>

      <div class="divider"></div>

      <div class="row">
        <label class="label" for="portInput">Bridge Port</label>
        <input type="number" id="portInput" min="1024" max="65535" />
      </div>

      <div class="row" style="margin-top: 8px">
        <label class="label" for="minSizeInput">Min Size (MB)</label>
        <input type="number" id="minSizeInput" min="0" max="10000" />
      </div>
    </div>

    <div class="card">
      <div class="label">Quick Send URL</div>
      <input type="url" id="quickUrl" placeholder="https://example.com/file.zip" />
      <button id="sendBtn">Download in HyperDM</button>
      <div id="feedback" class="msg"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
