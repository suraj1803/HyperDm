<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HyperDM Integration</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        background: #111318;
        color: #e2e2e9;
        font-family: "Google Sans", "Roboto", Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 15px;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 10px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .badge.online {
        background: #0f5223;
        color: #c4eed0;
      }
      .badge.offline {
        background: #8c1d18;
        color: #f9dedc;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .card {
        background: #1d2026;
        border-radius: 18px;
        padding: 12px 14px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .label {
        font-size: 12px;
        color: #e2e2e9;
        font-weight: 500;
      }
      .sub {
        font-size: 11px;
        color: #c4c6d0;
        margin-top: 2px;
      }
      input[type="number"],
      input[type="url"] {
        background: #111318;
        border: 1px solid #44474e;
        color: #e2e2e9;
        border-radius: 10px;
        padding: 7px 10px;
        font-size: 12px;
        outline: none;
      }
      input[type="number"] {
        width: 84px;
        text-align: right;
      }
      input[type="url"] {
        width: 100%;
        margin-top: 8px;
      }
      input:focus {
        border-color: #a8c7fa;
      }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 9px 14px;
        border: none;
        border-radius: 999px;
        background: #a8c7fa;
        color: #062e6f;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.06);
      }
      .msg {
        margin-top: 6px;
        font-size: 11px;
        min-height: 14px;
      }
      .msg.ok {
        color: #6dd58c;
      }
      .msg.err {
        color: #f2b8b5;
      }
      .divider {
        height: 1px;
        background: #282a31;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="icons/icon128.png" alt="HyperDM" />
        <span>HyperDM</span>
      </div>
      <span id="statusBadge" class="badge offline">
        <span class="dot"></span>
        <span id="statusText">Checking...</span>
      </span>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <div class="label">Intercept Downloads</div>
          <div class="sub">Auto-send downloads to HyperDM</div>
        </div>
        <input type="checkbox" id="enabledToggle" />
      </div>

      <div class="divider"></div>

      <div class="row">
        <label class="label" for="portInput">Bridge Port</label>
        <input type="number" id="portInput" min="1024" max="65535" />
      </div>

      <div class="row" style="margin-top: 8px">
        <label class="label" for="minSizeInput">Min Size (MB)</label>
        <input type="number" id="minSizeInput" min="0" max="10000" />
      </div>
    </div>

    <div class="card">
      <div class="label">Quick Send URL</div>
      <input type="url" id="quickUrl" placeholder="https://example.com/file.zip" />
      <button id="sendBtn">Download in HyperDM</button>
      <div id="feedback" class="msg"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
