[package]
name = "hyperdm"
version = "1.0.0"
description = "HyperDM — High-Speed Download Manager with Dynamic File Segmentation"
authors = ["HyperDM"]
edition = "2021"

[lib]
name = "hyperdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "deflate"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"
url = "2"
percent-encoding = "2"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
